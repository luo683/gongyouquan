# 工友圈 - one command, whole stack.
#
#   cp infra/deploy/.env.example infra/deploy/.env   # the five secrets are empty here
#   infra/deploy/gen-secrets.sh                      # fills them, refuses to overwrite
#   docker compose -f infra/deploy/docker-compose.yml up -d --build
#   docker compose -f infra/deploy/docker-compose.yml run --rm server \
#     node --import tsx src/cli/create-admin.ts      # prints the first account
#   open http://localhost:8080
#   docker compose -f infra/deploy/docker-compose.yml down       # keeps the volume
#   docker compose -f infra/deploy/docker-compose.yml down -v    # throws the data away
#
# Every secret below is a required interpolation (`VAR:?message`), so
# `docker compose config` refuses to parse rather than quietly booting a stack
# whose credentials anyone can read off GitHub. A committed default would be the
# same thing under a different name, which is why there are none left in here -
# including the old db/01-set-password.sql, which stated the development
# password in a file that ships with the repository.
#
# This is still a demo target and not a production deployment: Caddy serves plain
# http on :8080, there is no meilisearch and no uptime-kuma, and the backups
# volume has no offsite copy until RESTIC_REPOSITORY is configured.
#
# All values are quoted. `*` and `&` are YAML indicators, and an unquoted
# `***` here is parsed as an undefined anchor - the file fails before Docker ever
# sees it.
name: gongyouquan

services:
  db:
    # Mirror-pinned because registry-1.docker.io is unreachable from at least one
    # development machine in this project (docs/decisions/0002).
    image: docker.m.daocloud.io/library/postgres:17-alpine
    environment:
      POSTGRES_USER: '${POSTGRES_USER:?POSTGRES_USER 未设置（cp .env.example .env 后跑 gen-secrets.sh）}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 未设置（见 infra/deploy/.env.example）}'
      POSTGRES_DB: '${POSTGRES_DB:?POSTGRES_DB 未设置（见 infra/deploy/.env.example）}'
      # Verified rather than assumed: a wrong password from another container is
      # refused with 28P01, so non-localhost connections do require the secret.
      # The image's own localhost `trust` lines stay in place regardless of this
      # variable.
      POSTGRES_HOST_AUTH_METHOD: 'scram-sha-256'
    volumes:
      - dbdata:/var/lib/postgresql/data
      # No initdb.d here. There used to be a 01-set-password.sql that ran
      # `ALTER USER ... PASSWORD 'dev-db-password-only'` because POSTGRES_PASSWORD
      # alone was believed to leave the role's SCRAM verifier mismatched. It does
      # not: a freshly generated password, including one containing space `@ / +`
      # `=`, authenticates from a neighbouring container on this image. What that
      # file actually did was commit a credential.
      #
      # Consequence worth knowing: POSTGRES_PASSWORD is only applied to an
      # existing volume by ALTER USER (手册 4.1 的轮换影响一栏). Changing it in
      # .env and re-running `up -d` leaves a database that rejects the new value.
    healthcheck:
      # $$ so compose leaves the expansion to the container's own shell: the
      # names never have to be repeated in a file that is rendered by config.
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    build:
      context: ../..
      dockerfile: infra/deploy/Dockerfile.server
    environment:
      NODE_ENV: 'production'
      PORT: '3000'
      # The service name, not localhost: containers reach each other by network.
      # The three names below are already required by the `db` service, and one
      # `:?` anywhere in the file fails the whole parse, so repeating the message
      # here would only add three copies of the same sentence.
      # POSTGRES_PASSWORD must stay URL-safe (gen-secrets.sh makes it hex) - see
      # docs/decisions/0012.
      DATABASE_URL: 'postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}'
      JWT_SECRET: '${JWT_SECRET:?JWT_SECRET 未设置（见 infra/deploy/.env.example）}'
      UPLOAD_DIR: '/var/lib/gongyouquan/uploads'
      PUBLIC_ORIGIN: 'http://localhost:8080'
      # Meilisearch is intentionally absent from the stack: the spec's degraded
      # path is PG pg_trgm, and that is what the real database already verified.
      MEILI_URL: 'http://127.0.0.1:7700'
      # Required because apps/server refuses to start with an empty one, not
      # because anything here talks to it. Requiring it now means the day
      # meilisearch is added there is no literal left in a committed file to
      # replace.
      MEILI_MASTER_KEY: '${MEILI_MASTER_KEY:?MEILI_MASTER_KEY 未设置（见 infra/deploy/.env.example）}'
      ALERT_HMAC_SECRET: '${ALERT_HMAC_SECRET:?ALERT_HMAC_SECRET 未设置（见 infra/deploy/.env.example）}'
      # Which group /hooks/alert posts into, including this process's own
      # presence-drift line. Deliberately `${:-}` rather than `:?`: a blank one
      # leaves the endpoint answering 503 OPS_GROUP_NOT_CONFIGURED (reason
      # `env-unset`), which is the right size of problem for a group that only the
      # alert path reads - it must not hold the login path hostage. env.ts reads an
      # empty string as unset for exactly this reason.
      # cli/create-admin.ts creates #运维告警 and prints the id to put here.
      SYSTEM_GROUP_ID: '${SYSTEM_GROUP_ID:-}'
      LOG_LEVEL: 'info'
      # Injected rather than computed at build time; sync:hello carries it so an
      # old client can warn instead of drifting silently.
      CONTRACT_VERSION: 'compose-local'
    volumes:
      - uploads:/var/lib/gongyouquan/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # node:22-slim has no wget and no curl, so the probe cannot be a shell
      # one-liner against a tool that is not in the image. Node 22 has global
      # fetch, and it is the only HTTP client guaranteed to be present.
      test: [
        'CMD',
        'node',
        '-e',
        "fetch('http://127.0.0.1:3000/readyz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
      ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: ../..
      dockerfile: infra/deploy/Dockerfile.web
    ports:
      - '8080:8080'
    depends_on:
      server:
        condition: service_healthy

  # 手册 3.2 的 backup 服务：调度 infra/backup/ 里的三个脚本。在此之前那两个脚本
  # 只是仓库里的文件——没有任何东西跑它们。
  backup:
    build:
      context: ../..
      dockerfile: infra/backup/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      # The service name, and the same three names the db was created with.
      PG_HOST: 'db'
      POSTGRES_USER: '${POSTGRES_USER}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD}'
      POSTGRES_DB: '${POSTGRES_DB}'
      BACKUP_DIR: '/backups'
      UPLOADS_DIR: '/data/uploads'
      # 手册 4.3：`.env` 要 age 加密后随备份一起带走。这个 compose 文件所在的
      # 目录就是 .env 所在的目录，所以路径与手册一致。没有 age 公钥时
      # backup-once.sh 会跳过它并打一行警告——**不会明文落盘**。
      ENV_FILE: '/opt/chat/.env'
      AGE_RECIPIENT_FILE: '/etc/age/recipient.pub'
      # 空 = 没有异地。backup-once.sh 对「没有异地」的默认行为是**直接失败**，
      # 所以下面那行 ALLOW_LOCAL_ONLY 是这条栈唯一的例外声明。
      #
      # 手册 8.1 的立场没有例外（「本地副本不是备份策略」），而 3.2 的
      # `RESTIC_REPOSITORY: ${RESTIC_REPOSITORY}` 没有默认值——照 8.1 硬实现，
      # 一台还没配对象存储的机器会拿到一个反复重启、红得和「备份真坏了」一样的
      # 容器。ALLOW_LOCAL_ONLY 因此是**手册里没有的变量**，把硬规则换成显式例外。
      # 全文见 docs/decisions/0013 第三节。
      #
      # 「配上 restic 仓库就删掉 `:-1`」这句还**没有到兑现的时候**：restic 分支
      # 这一轮真的跑通了，但仓库在 /backups 同一个卷上，机器没了它也没了，不满足
      # 8.1。要删这一行，需要的是指向对象存储或另一台机器的 RESTIC_REPOSITORY。
      # 见 docs/decisions/0014 第七节。
      RESTIC_REPOSITORY: '${RESTIC_REPOSITORY:-}'
      RESTIC_PASSWORD: '${RESTIC_PASSWORD:-}'
      ALLOW_LOCAL_ONLY: '${ALLOW_LOCAL_ONLY:-1}'
      BACKUP_HOUR: '${BACKUP_HOUR:-3}'
      BACKUP_MINUTE: '${BACKUP_MINUTE:-0}'
    volumes:
      - uploads:/data/uploads:ro
      - backups:/backups
      # Read-only, and it has to be: this container's job is copying secrets,
      # not rotating them, and a writable mount means a bug in a backup script
      # could rewrite the credentials the whole stack authenticates with.
      # If the secrets were exported into the environment instead of living in
      # this file, Docker would create an empty *directory* here instead - the
      # script notices and logs "不存在，跳过", which is the safe direction.
      - ./.env:/opt/chat/.env:ro
      # Only the **public** half of the age keypair belongs here. Generate it off
      # the box (`age-keygen -o ~/gyq.age.key`, then `age-keygen -y ~/gyq.age.key`
      # into this directory as recipient.pub); a private key next to the ciphertext
      # it decrypts is not encryption.
      #
      # The directory is mounted rather than recipient.pub itself on purpose:
      # Docker answers a bind mount of a *missing file* by creating an empty
      # directory at the target, and then `age` fails on a directory instead of
      # backup-once.sh taking its documented "no pubkey, skip, never write
      # plaintext" path. A missing file inside a mounted directory is the safe
      # shape of the same mistake.
      #
      # Both mounts exist because the ops manual's own 3.2 service definition
      # cannot satisfy its 4.3 requirement: `env_file: [.env]` injects values into
      # the process and leaves no readable file behind, so as written the container
      # has neither the .env nor a place for the key. See docs/decisions/0013 一.
      - ./age:/etc/age:ro
    security_opt:
      - 'no-new-privileges:true'
    # 手册 2.4 给 backup 的是 100m。这里给 256m，因为超出的部分正是这个容器最
    # 不能省的两件事：`pg_dump -Z6` 的压缩缓冲与 restic 的上传。被 cgroup 杀掉是
    # 无预警的，而它杀的是备份——下一个需要恢复的人只会发现副本停在三天前。
    # 上线前按真实数据量重测这个数（**目前没有实测依据**：本轮的 dump 来自一个只有
    # 3 条消息的开发库，压缩与上传都远未触顶，所以别把这个数当结论抄进部署清单）。
    # 取舍的全文见 docs/decisions/0013 第二节，待办在 docs/HANDOVER.md §5 第 6 条。
    mem_limit: '256m'
    cpus: 0.5
    healthcheck:
      # Not "is the process alive" - supercronic is always alive. This is
      # 巡检项 20: how long since a backup actually *succeeded*.
      test: ['CMD', '/usr/local/bin/backup-health.sh']
      interval: 10m
      timeout: 10s
      retries: 3
      # backup-loop.sh 只在 `last_success.json` 缺失或超过 26 小时的情况下，于启动时
      # 补跑一次，所以装机第一天不会有标记文件——那段时间的红是预期而不是故障。
      # 实测：把标记文件移走后重启容器，首次备份在启动后约 1 分钟内写出，5m 够用。
      start_period: 5m

volumes:
  dbdata:
  uploads:
  backups:
