# 工友圈 - one command, whole stack.
#
#   cp infra/deploy/.env.example infra/deploy/.env   # the five secrets are empty here
#   infra/deploy/gen-secrets.sh                      # fills them, refuses to overwrite
#   docker compose -f infra/deploy/docker-compose.yml up -d --build
#   docker compose -f infra/deploy/docker-compose.yml run --rm server \
#     node --import tsx src/cli/create-admin.ts      # prints the first account
#   open http://localhost:8080
#   docker compose -f infra/deploy/docker-compose.yml down       # keeps the volume
#   docker compose -f infra/deploy/docker-compose.yml down -v    # throws the data away
#
# Every secret below is a required interpolation (`VAR:?message`), so
# `docker compose config` refuses to parse rather than quietly booting a stack
# whose credentials anyone can read off GitHub. A committed default would be the
# same thing under a different name, which is why there are none left in here -
# including the old db/01-set-password.sql, which stated the development
# password in a file that ships with the repository.
#
# This is still a demo target and not a production deployment: Caddy serves plain
# http on :8080, there is no meilisearch and no uptime-kuma, and the backups
# volume has no offsite copy until RESTIC_REPOSITORY is configured.
#
# All values are quoted. `*` and `&` are YAML indicators, and an unquoted
# `***` here is parsed as an undefined anchor - the file fails before Docker ever
# sees it.
name: gongyouquan

services:
  db:
    # Mirror-pinned because registry-1.docker.io is unreachable from at least one
    # development machine in this project (docs/decisions/0002).
    image: docker.m.daocloud.io/library/postgres:17-alpine
    environment:
      POSTGRES_USER: '${POSTGRES_USER:?POSTGRES_USER 未设置（cp .env.example .env 后跑 gen-secrets.sh）}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 未设置（见 infra/deploy/.env.example）}'
      POSTGRES_DB: '${POSTGRES_DB:?POSTGRES_DB 未设置（见 infra/deploy/.env.example）}'
      # Verified rather than assumed: a wrong password from another container is
      # refused with 28P01, so non-localhost connections do require the secret.
      # The image's own localhost `trust` lines stay in place regardless of this
      # variable.
      POSTGRES_HOST_AUTH_METHOD: 'scram-sha-256'
    volumes:
      - dbdata:/var/lib/postgresql/data
      # No initdb.d here. There used to be a 01-set-password.sql that ran
      # `ALTER USER ... PASSWORD 'dev-db-password-only'` because POSTGRES_PASSWORD
      # alone was believed to leave the role's SCRAM verifier mismatched. It does
      # not: a freshly generated password, including one containing space `@ / +`
      # `=`, authenticates from a neighbouring container on this image. What that
      # file actually did was commit a credential.
      #
      # Consequence worth knowing: POSTGRES_PASSWORD is only applied to an
      # existing volume by ALTER USER (手册 4.1 的轮换影响一栏). Changing it in
      # .env and re-running `up -d` leaves a database that rejects the new value.
    healthcheck:
      # $$ so compose leaves the expansion to the container's own shell: the
      # names never have to be repeated in a file that is rendered by config.
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    build:
      context: ../..
      dockerfile: infra/deploy/Dockerfile.server
    environment:
      NODE_ENV: 'production'
      PORT: '3000'
      # The service name, not localhost: containers reach each other by network.
      # The three names below are already required by the `db` service, and one
      # `:?` anywhere in the file fails the whole parse, so repeating the message
      # here would only add three copies of the same sentence.
      # POSTGRES_PASSWORD must stay URL-safe (gen-secrets.sh makes it hex) - see
      # docs/decisions/0012.
      DATABASE_URL: 'postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}'
      JWT_SECRET: '${JWT_SECRET:?JWT_SECRET 未设置（见 infra/deploy/.env.example）}'
      UPLOAD_DIR: '/var/lib/gongyouquan/uploads'
      PUBLIC_ORIGIN: 'http://localhost:8080'
      # Meilisearch is intentionally absent from the stack: the spec's degraded
      # path is PG pg_trgm, and that is what the real database already verified.
      MEILI_URL: 'http://127.0.0.1:7700'
      # Required because apps/server refuses to start with an empty one, not
      # because anything here talks to it. Requiring it now means the day
      # meilisearch is added there is no literal left in a committed file to
      # replace.
      MEILI_MASTER_KEY: '${MEILI_MASTER_KEY:?MEILI_MASTER_KEY 未设置（见 infra/deploy/.env.example）}'
      ALERT_HMAC_SECRET: '${ALERT_HMAC_SECRET:?ALERT_HMAC_SECRET 未设置（见 infra/deploy/.env.example）}'
      LOG_LEVEL: 'info'
      # Injected rather than computed at build time; sync:hello carries it so an
      # old client can warn instead of drifting silently.
      CONTRACT_VERSION: 'compose-local'
    volumes:
      - uploads:/var/lib/gongyouquan/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # node:22-slim has no wget and no curl, so the probe cannot be a shell
      # one-liner against a tool that is not in the image. Node 22 has global
      # fetch, and it is the only HTTP client guaranteed to be present.
      test: [
        'CMD',
        'node',
        '-e',
        "fetch('http://127.0.0.1:3000/readyz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
      ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: ../..
      dockerfile: infra/deploy/Dockerfile.web
    ports:
      - '8080:8080'
    depends_on:
      server:
        condition: service_healthy

volumes:
  dbdata:
  uploads:
